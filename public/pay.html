<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Vehicle Permit — Payment</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 1rem; color: #1a1a1a; }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.2rem; margin: 0 0 .75rem; }
    #status { padding: .75rem 1rem; border-radius: 6px; margin: .5rem 0; }
    #status.info    { background: #e8f4fd; color: #0b3a5b; }
    #status.error   { background: #fdecea; color: #611a15; }
    #status.success { background: #edf7ed; color: #1e4620; }
    #paymentIframe { width: 100%; border: 0; min-height: 400px; transition: height .2s ease; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Student Vehicle Permit — Payment</h1>
    <div id="status" class="info">Loading secure payment form…</div>
    <iframe id="paymentIframe" name="paymentIframe" class="hidden"
            title="Authorize.net secure payment form"></iframe>
  </div>

  <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var reg = params.get('reg');
    var permit = params.get('permit');

    var statusEl = document.getElementById('status');
    var iframe = document.getElementById('paymentIframe');

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = kind || 'info';
    }

    if (!reg || !permit) {
      setStatus('This payment link is missing the registration id or permit type.', 'error');
      return;
    }

    // 1) Ask our server to mint a one-time hosted form token.
    fetch('/api/permit/pay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reg: reg, permit: permit })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.body.error || 'Could not start payment.');
        openHostedForm(res.body.token, res.body.formUrl);
      })
      .catch(function (e) { setStatus(e.message, 'error'); });

    // 2) POST the token into the iframe to render the Accept Hosted form.
    function openHostedForm(token, formUrl) {
      var form = document.createElement('form');
      form.method = 'post';
      form.action = formUrl;
      form.target = 'paymentIframe';

      var input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'token';
      input.value = token;
      form.appendChild(input);

      document.body.appendChild(form);
      iframe.classList.remove('hidden');
      setStatus('Enter your payment details below.', 'info');
      form.submit();
    }

    // 3) Receive messages relayed by IFrameCommunicator.html (same origin).
    //    The communicator calls window.parent.parent.AuthorizeNetIFrame.onReceiveCommunication.
    window.AuthorizeNetIFrame = {
      onReceiveCommunication: function (queryStr) {
        var p = new URLSearchParams(queryStr);
        switch (p.get('action')) {
          case 'resizeWindow':
            iframe.style.height = (parseInt(p.get('height'), 10) + 20) + 'px';
            break;
          case 'cancel':
            iframe.classList.add('hidden');
            setStatus('Payment cancelled.', 'info');
            break;
          case 'transactResponse':
            handleTransaction(p.get('response'));
            break;
        }
      }
    };

    // 4) On a transaction response, verify server-side before celebrating.
    function handleTransaction(responseStr) {
      var transId = '';
      try { transId = JSON.parse(responseStr).transId; } catch (e) {}

      iframe.classList.add('hidden');
      setStatus('Confirming your payment…', 'info');

      fetch('/api/permit/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reg: reg, transId: transId })
      })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
        .then(function (res) {
          if (res.ok) {
            setStatus('Payment received (transaction ' + res.body.transId + '). '
              + 'Student Financial Services has been notified. You may close this window.', 'success');
          } else {
            setStatus('We could not confirm your payment: ' + (res.body.error || 'unknown error')
              + '. If you were charged, contact Student Financial Services.', 'error');
          }
        })
        .catch(function (e) { setStatus('Verification error: ' + e.message, 'error'); });
    }
  })();
  </script>
</body>
</html>
