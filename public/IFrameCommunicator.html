<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IFrame Communicator</title>
  <script type="text/javascript">
    // Relays messages from the Authorize.net hosted form (window.parent) up to
    // the merchant payment page (window.parent.parent). This page MUST be served
    // from the SAME ORIGIN as pay.html, or the browser will block the handoff.
    function callParentFunction(str) {
      if (str && str.length > 0 &&
          window.parent && window.parent.parent &&
          window.parent.parent.AuthorizeNetIFrame &&
          typeof window.parent.parent.AuthorizeNetIFrame.onReceiveCommunication === 'function') {
        window.parent.parent.AuthorizeNetIFrame.onReceiveCommunication(str);
      }
    }

    function receiveMessage(event) {
      if (event && event.data) {
        callParentFunction(event.data);
      }
    }

    if (window.addEventListener) {
      window.addEventListener('message', receiveMessage, false);
    } else if (window.attachEvent) {
      window.attachEvent('onmessage', receiveMessage);
    }

    // Authorize.net may also pass the payload on the query string or fragment.
    if (window.location.search && window.location.search.length > 1) {
      callParentFunction(window.location.search.substring(1));
    }
    if (window.location.hash && window.location.hash.length > 1) {
      callParentFunction(window.location.hash.substring(1));
    }
  </script>
</head>
<body></body>
</html>
