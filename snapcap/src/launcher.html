<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; media-src 'self' file:; style-src 'self' 'unsafe-inline'">
<title>SnapCap</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 16px 18px 12px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 16px; margin: 0; }
  .brand .muted { color: var(--muted); font-size: 12px; }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .mode { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; text-align: left; border-radius: 10px; }
  .mode b { font-size: 14px; }
  .mode .ico { font-size: 22px; line-height: 1; color: var(--accent); }
  .mode.rec .ico { color: var(--danger); }
  .mode kbd { margin-top: 2px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; color: var(--muted); }
  .opts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .opts input[type=checkbox] { accent-color: var(--accent); }
  #warn { display: none; color: #ffcf70; font-size: 12px; }
  .libbar { display: flex; align-items: center; gap: 8px; padding: 10px 18px; }
  .libbar h2 { font-size: 13px; margin: 0; flex: 1; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #grid { flex: 1; overflow: auto; padding: 0 18px 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
  .card:hover { border-color: var(--accent); }
  .thumb { height: 120px; background: #0e0f12; display: flex; align-items: center; justify-content: center; position: relative; }
  .thumb img, .thumb video { max-width: 100%; max-height: 100%; }
  .badge { position: absolute; top: 6px; left: 6px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .meta { padding: 8px 10px; display: flex; align-items: center; gap: 6px; }
  .meta .t { flex: 1; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta button { padding: 2px 7px; font-size: 12px; }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 50px 0; }
  @media (max-width: 720px) { .modes { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>SnapCap</h1><span class="muted">Screen capture · recording · annotation</span></div>
  <div class="modes">
    <button class="mode" data-mode="region"><span class="ico">⬚</span><b>Region</b><kbd data-key="region"></kbd></button>
    <button class="mode" data-mode="window"><span class="ico">▣</span><b>Window</b><kbd data-key="window"></kbd></button>
    <button class="mode" data-mode="fullscreen"><span class="ico">⛶</span><b>Full screen</b><kbd data-key="fullscreen"></kbd></button>
    <button class="mode rec" data-mode="record"><span class="ico">●</span><b>Record video</b><kbd data-key="record"></kbd></button>
  </div>
  <div class="opts">
    <label>Delay
      <select id="delay"><option value="0">None</option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option></select>
    </label>
    <label><input type="checkbox" id="copyAfterCapture"> Copy to clipboard</label>
    <label><input type="checkbox" id="openEditor"> Open editor after capture</label>
    <label><input type="checkbox" id="recordMic"> Record microphone</label>
    <label id="sysAudioWrap"><input type="checkbox" id="recordSystemAudio"> Record system audio</label>
    <label><input type="checkbox" id="recordCountdown"> 3‑second countdown before recording</label>
  </div>
  <div id="warn"></div>
</header>
<div class="libbar">
  <h2>Library</h2>
  <button id="import">Open image…</button>
  <button id="folder">Show folder</button>
</div>
<div id="grid"></div>
<script src="launcher.js"></script>
</body>
</html>
