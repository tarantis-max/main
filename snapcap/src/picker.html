<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>SnapCap — Choose a window</title>
<link rel="stylesheet" href="theme.css">
<style>
  header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  h1 { font-size: 15px; margin: 0; }
  #grid { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; overflow: auto; height: calc(100% - 56px); }
  .item { background: var(--panel); border: 2px solid transparent; border-radius: var(--radius); padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .item:hover, .item:focus { border-color: var(--accent); outline: none; }
  .thumb { height: 130px; display: flex; align-items: center; justify-content: center; background: #0e0f12; border-radius: 6px; overflow: hidden; }
  .thumb img { max-width: 100%; max-height: 100%; }
  .name { display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name img { width: 16px; height: 16px; flex: none; }
  .empty { color: var(--muted); padding: 40px; text-align: center; grid-column: 1/-1; }
</style>
</head>
<body>
<header><h1>Click a window to capture it</h1><button id="cancel">Cancel <kbd>Esc</kbd></button></header>
<div id="grid"></div>
<script src="picker.js"></script>

</body>
</html>
